services:
  postgres:
    image: postgres:17-alpine
    container_name: needle-postgres
    environment:
      POSTGRES_DB: needle
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: needle
    ports:
      - "5432:5432"
    volumes:
      - needle-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    container_name: needle-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"
      - "4317:4317"
    
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: needle-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: needle-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NeedleDatabase: Host=postgres;Port=5432;Database=needle;Username=needle;Password=needle
      Jwt__Issuer: Needle
      Jwt__Audience: Needle.Api
      Jwt__SigningKey: needle-development-signing-key-only-for-local-study
      Jwt__ExpiresInMinutes: 60
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
    ports:
      - "5195:8080"

volumes:
  needle-postgres-data: