services:
  postgres:
    image: postgres:17-alpine
    container_name: needle-postgres

    environment:
      POSTGRES_DB: needle
      POSTGRES_USER: needle
      POSTGRES_PASSWORD: needle

    ports:
      - "5432:5432"

    volumes:
      - needle-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needle -d needle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  needle-postgres-data: